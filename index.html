<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Checklists</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; color: #333; min-height: 100vh; }
    header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 20px 16px 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    .container { max-width: 480px; margin: 0 auto; padding: 16px; }
    #home-screen, #list-screen { display: none; }
    #home-screen.active, #list-screen.active { display: block; }

    /* ── Dashboard Stats ── */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1; }
    .stat-card .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-top: 4px; }
    .stat-card.total   .stat-value { color: #4f46e5; }
    .stat-card.done    .stat-value { color: #22c55e; }
    .stat-card.pending .stat-value { color: #f59e0b; }
    .stat-card.urgent  .stat-value { color: #ef4444; }

    /* ── New List Box ── */
    .new-list-box { background: white; border-radius: 14px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .new-list-box h2 { font-size: 1rem; margin-bottom: 10px; color: #4f46e5; }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input[type="text"]:focus { border-color: #4f46e5; }
    button.btn-primary { background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 10px; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
    button.btn-primary:active { background: #3730a3; }

    /* ── Urgent Toggle ── */
    .urgent-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .urgent-toggle {
      display: flex; align-items: center; gap: 6px;
      background: #f9fafb; border: 2px solid #e0e0e0;
      border-radius: 10px; padding: 6px 12px;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      color: #888; transition: all 0.2s; user-select: none;
    }
    .urgent-toggle.active { background: #fff1f1; border-color: #ef4444; color: #ef4444; }

    .section-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 10px; }

    /* ── List Cards (Home) ── */
    .list-card { background: white; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .list-card-info { flex: 1; }
    .list-card-name { font-weight: 600; font-size: 1rem; }
    .list-card-meta { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .list-card-emoji { font-size: 1.5rem; margin-right: 12px; }
    .btn-icon { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 4px 6px; border-radius: 8px; color: #ccc; }

    /* ── List Screen ── */
    .list-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .btn-back { background: white; border: 2px solid #e0e0e0; border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer; color: #4f46e5; font-weight: 600; }
    .list-title { font-size: 1.2rem; font-weight: 700; flex: 1; }
    .progress-bar-wrap { background: #e0e0e0; border-radius: 10px; height: 8px; margin-bottom: 16px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, #4f46e5, #7c3aed); height: 100%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-label { font-size: 0.78rem; color: #888; text-align: right; margin-top: -12px; margin-bottom: 14px; }
    .add-item-box { background: white; border-radius: 14px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .checklist-items { list-style: none; }

    /* ── Checklist Items ── */
    .checklist-item { background: white; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: opacity 0.2s; border-left: 4px solid transparent; }
    .checklist-item.urgent-item { border-left: 4px solid #ef4444; }
    .checklist-item.done { opacity: 0.5; }
    .checklist-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #4f46e5; cursor: pointer; flex-shrink: 0; }
    .item-label { flex: 1; font-size: 0.95rem; word-break: break-word; }
    .checklist-item.done .item-label { text-decoration: line-through; color: #aaa; }
    .urgent-badge { font-size: 0.65rem; background: #fff1f1; color: #ef4444; border: 1px solid #fecaca; border-radius: 6px; padding: 2px 6px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }

    .empty-state { text-align: center; padding: 30px 0; color: #bbb; font-size: 0.9rem; }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 8px; }
    .clear-btn { width: 100%; margin-top: 10px; background: #fff0f0; color: #e53e3e; border: 2px solid #fecaca; border-radius: 10px; padding: 10px; font-size: 0.9rem; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <h1>✅ My Checklists</h1>
  <p>Tap a list to open it, or create a new one</p>
</header>

<div class="container">

  <div id="home-screen" class="active">
    <br/>
    <div class="new-list-box">
      <h2>➕ New Checklist</h2>
      <div class="input-row">
        <input type="text" id="new-list-input" placeholder="e.g. Beach Trip, Recipe..." maxlength="40"/>
        <button class="btn-primary" onclick="createList()">Create</button>
      </div>
    </div>
    <div class="section-title">Your Lists</div>
    <div id="lists-container"></div>
  </div>

  <div id="list-screen">
    <div class="list-header">
      <button class="btn-back" onclick="goHome()">← Back</button>
      <div class="list-title" id="list-screen-title"></div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">
      <div class="stat-card total">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card done">
        <div class="stat-value" id="stat-done">0</div>
        <div class="stat-label">Done</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-value" id="stat-pending">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-card urgent">
        <div class="stat-value" id="stat-urgent">0</div>
        <div class="stat-label">Urgent</div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-label" id="progress-label">0 of 0 done</div>

    <div class="add-item-box">
      <div class="input-row">
        <input type="text" id="new-item-input" placeholder="Add an item..." maxlength="80"/>
        <button class="btn-primary" onclick="addItem()">Add</button>
      </div>
      <div class="urgent-row">
        <div class="urgent-toggle" id="urgent-toggle" onclick="toggleUrgent()">🔴 Mark as Urgent</div>
      </div>
    </div>

    <div class="section-title">Items</div>
    <ul class="checklist-items" id="checklist-items"></ul>
    <button class="clear-btn" onclick="clearChecked()">🗑 Remove Checked Items</button>
  </div>

</div>

<script>
  // Code Generated by Sidekick is for learning and experimentation purposes only.
  let lists = [];
  let currentListId = null;
  let isUrgent = false;

  function loadData() {
    const saved = localStorage.getItem('my_checklists');
    lists = saved ? JSON.parse(saved) : [];
  }

  function saveData() {
    localStorage.setItem('my_checklists', JSON.stringify(lists));
  }

  function pickEmoji(name) {
    const n = name.toLowerCase();
    if (n.match(/trip|travel|pack|vac|flight|hotel/)) return '✈️';
    if (n.match(/recipe|cook|food|meal|dinner|lunch|breakfast/)) return '🍳';
    if (n.match(/shop|grocery|store|buy|market/)) return '🛒';
    if (n.match(/work|meeting|office|task|project/)) return '💼';
    if (n.match(/gym|workout|fitness|exercise/)) return '💪';
    if (n.match(/book|read|study|learn/)) return '📚';
    if (n.match(/movie|show|watch/)) return '🎬';
    if (n.match(/party|event|birthday|wedding/)) return '🎉';
    return '📋';
  }

  function toggleUrgent() {
    isUrgent = !isUrgent;
    const btn = document.getElementById('urgent-toggle');
    btn.classList.toggle('active', isUrgent);
    btn.textContent = isUrgent ? '🔴 Urgent ON' : '🔴 Mark as Urgent';
  }

  function renderHome() {
    const container = document.getElementById('lists-container');
    if (lists.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>No checklists yet. Create one above!</div></div>';
      return;
    }
    container.innerHTML = lists.map(list => {
      const total = list.items.length;
      const done = list.items.filter(i => i.checked).length;
      const urgent = list.items.filter(i => i.urgent && !i.checked).length;
      const urgentBadge = urgent > 0 ? ' 🔴 ' + urgent + ' urgent' : '';
      return '<div class="list-card" onclick="openList(\'' + list.id + '\')">' +
        '<span class="list-card-emoji">' + list.emoji + '</span>' +
        '<div class="list-card-info">' +
        '<div class="list-card-name">' + list.name + '</div>' +
        '<div class="list-card-meta">' + done + ' / ' + total + ' done' + urgentBadge + '</div>' +
        '</div>' +
        '<button class="btn-icon" onclick="deleteList(event,\'' + list.id + '\')">🗑</button>' +
        '</div>';
    }).join('');
  }

  function createList() {
    const input = document.getElementById('new-list-input');
    const name = input.value.trim();
    if (!name) return;
    lists.unshift({ id: Date.now().toString(), name, emoji: pickEmoji(name), items: [] });
    saveData();
    renderHome();
    input.value = '';
    input.focus();
  }

  function deleteList(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this checklist?')) return;
    lists = lists.filter(l => l.id !== id);
    saveData();
    renderHome();
  }

  function openList(id) {
    currentListId = id;
    isUrgent = false;
    document.getElementById('urgent-toggle').classList.remove('active');
    document.getElementById('urgent-toggle').textContent = '🔴 Mark as Urgent';
    document.getElementById('home-screen').classList.remove('active');
    document.getElementById('list-screen').classList.add('active');
    renderList();
  }

  function goHome() {
    currentListId = null;
    document.getElementById('list-screen').classList.remove('active');
    document.getElementById('home-screen').classList.add('active');
    renderHome();
  }

  function updateDashboard(list) {
    const total   = list.items.length;
    const done    = list.items.filter(i => i.checked).length;
    const pending = list.items.filter(i => !i.checked).length;
    const urgent  = list.items.filter(i => i.urgent && !i.checked).length;
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-done').textContent    = done;
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-urgent').textContent  = urgent;
    document.getElementById('progress-fill').style.width  = percent + '%';
    document.getElementById('progress-label').textContent = done + ' of ' + total + ' done';
  }

  function renderList() {
    const list = lists.find(l => l.id === currentListId);
    if (!list) return;
    document.getElementById('list-screen-title').textContent = list.emoji + ' ' + list.name;
    updateDashboard(list);
    const ul = document.getElementById('checklist-items');
    if (list.items.length === 0) {
      ul.innerHTML = '<div class="empty-state"><div class="icon">🗒️</div><div>No items yet. Add something above!</div></div>';
      return;
    }
    ul.innerHTML = list.items.map((item, idx) =>
      '<li class="checklist-item ' + (item.checked ? 'done' : '') + ' ' + (item.urgent && !item.checked ? 'urgent-item' : '') + '">' +
      '<input type="checkbox" ' + (item.checked ? 'checked' : '') + ' onchange="toggleItem(' + idx + ')"/>' +
      '<span class="item-label">' + item.text + '</span>' +
      (item.urgent && !item.checked ? '<span class="urgent-badge">Urgent</span>' : '') +
      '<button class="btn-icon" onclick="deleteItem(' + idx + ')">✕</button>' +
      '</li>'
    ).join('');
  }

  function addItem() {
    const input = document.getElementById('new-item-input');
    const text = input.value.trim();
    if (!text) return;
    const list = lists.find(l => l.id === currentListId);
    list.items.push({ text, checked: false, urgent: isUrgent });
    saveData();
    renderList();
    input.value = '';
    isUrgent = false;
    document.getElementById('urgent-toggle').classList.remove('active');
    document.getElementById('urgent-toggle').textContent = '🔴 Mark as Urgent';
    input.focus();
  }

  function toggleItem(idx) {
    const list = lists.find(l => l.id === currentListId);
    list.items[idx].checked = !list.items[idx].checked;
    saveData();
    renderList();
  }

  function deleteItem(idx) {
    const list = lists.find(l => l.id === currentListId);
    list.items.splice(idx, 1);
    saveData();
    renderList();
  }

  function clearChecked() {
    const list = lists.find(l => l.id === currentListId);
    if (!list.items.some(i => i.checked)) return;
    if (!confirm('Remove all checked items?')) return;
    list.items = list.items.filter(i => !i.checked);
    saveData();
    renderList();
  }

  document.getElementById('new-list-input').addEventListener('keydown', e => { if (e.key === 'Enter') createList(); });
  document.getElementById('new-item-input').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

  loadData();
  renderHome();
</script>
</body>
</html>
